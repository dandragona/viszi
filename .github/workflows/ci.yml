name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [20, 22]
    runs-on: ${{ matrix.os }}
    name: ${{ matrix.os }} · Node ${{ matrix.node }}
    steps:
      - uses: actions/checkout@v4

      - name: Use Node ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Smoke (--help)
        run: npm run smoke

  pack-size:
    runs-on: ubuntu-latest
    needs: build-and-test
    name: npm pack size check
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: npm pack
        id: pack
        run: |
          tarball=$(npm pack --silent --pack-destination .)
          echo "tarball=$tarball" >> "$GITHUB_OUTPUT"
          size=$(stat -c%s "$tarball")
          echo "size=$size" >> "$GITHUB_OUTPUT"
          echo "Tarball $tarball is $size bytes"
      - name: Tarball must stay under 2 MB
        run: |
          size="${{ steps.pack.outputs.size }}"
          limit=$((2 * 1024 * 1024))
          if [ "$size" -ge "$limit" ]; then
            echo "::error::Tarball is $size bytes — exceeds 2 MB limit ($limit). Trim package.json#files or move large assets out of the npm payload."
            exit 1
          fi
      - name: Tarball must contain dist/web/
        run: |
          tarball="${{ steps.pack.outputs.tarball }}"
          if ! tar -tzf "$tarball" | grep -q '^package/dist/web/'; then
            echo "::error::Tarball does not contain dist/web/. The build:web step must run before publish."
            exit 1
          fi
